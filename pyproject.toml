[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtheme"
dynamic = ["version"]
description = "A GNOME desktop theme system: download, apply, switch, and author full-desktop themes from a palette"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "blyatiful1" }]
keywords = ["gnome", "theme", "ricing", "dotfiles", "desktop", "cli"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jsonschema>=4.0"]

[project.scripts]
gtheme = "gtheme.cli:main"

[project.urls]
Homepage = "https://github.com/blyatiful1/gtheme"
Issues = "https://github.com/blyatiful1/gtheme/issues"

# Version is single-sourced from src/gtheme/__init__.py.
[tool.hatch.version]
path = "src/gtheme/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gtheme"]

[tool.hatch.build.targets.wheel.force-include]
"themes" = "gtheme/_bundled_themes"
