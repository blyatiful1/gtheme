[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtheme"
dynamic = ["version"]
description = "Change how your GNOME desktop looks — safely, with one-click undo"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "blyatiful1" }]
keywords = ["gnome", "theme", "wallpaper", "extensions", "desktop", "customization"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: X11 Applications :: GTK",
    "Operating System :: POSIX :: Linux",
]

# SYSTEM DEPENDENCIES — deliberately NOT pip-pinned.
#
# gtheme is a GTK4/libadwaita app. Its UI half needs these from the distro's
# package manager, never from pip (the pip wheels either do not exist, or
# shadow the system typelibs and break):
#
#   * PyGObject      (Arch: python-gobject   Debian/Ubuntu: python3-gi)
#   * GTK 4          (Arch: gtk4             Debian/Ubuntu: libgtk-4-1)
#   * libadwaita 1.9 (Arch: libadwaita       Debian/Ubuntu: libadwaita-1-0)
#   * GLib/GIO + gsettings/dconf tooling (Arch: glib2 dconf)
#   * libsoup3       (Arch: libsoup3) — used by the extensions.gnome.org client
#
# Because of this, every virtualenv gtheme runs in MUST be created with
# --system-site-packages so `import gi` resolves to the distro's PyGObject:
#
#   uv venv --system-site-packages .venv && uv pip install -e '.[dev]'
#
# The pure-Python half below is the only thing pip is asked to provide.
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
# `build` + `hatchling` are here so the packaging test can build a real wheel
# offline (`python -m build --wheel --no-isolation`) and look inside it.
dev = ["pytest", "ruff", "build", "hatchling"]

[project.scripts]
gtheme = "gtheme.cli:main"

[project.urls]
Homepage = "https://github.com/blyatiful1/gtheme"
Issues = "https://github.com/blyatiful1/gtheme/issues"

# Version is single-sourced from src/gtheme/__init__.py.
[tool.hatch.version]
path = "src/gtheme/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gtheme"]

# Two different kinds of data, and they must NOT use the same mechanism.
#
# 1. Runtime data the app itself reads (bundled Looks, the settings
#    descriptions) belongs INSIDE the installed package, next to the code that
#    reads it. force-include puts it there.
[tool.hatch.build.targets.wheel.force-include]
"themes" = "gtheme/_bundled_themes"

# 2. Desktop-integration files (the app's launcher entry, its store listing,
#    its icons) belong under the install PREFIX, not inside the package.
#    shared-data is the mechanism for that: hatchling writes these into the
#    wheel's `.data/data/` tree, which is the only part of a wheel that
#    `python -m installer --destdir="$pkgdir"` unpacks to `/usr/share/...`.
#    force-include would put a literal `share/` directory into site-packages
#    instead, where nothing would ever find it (packaging.md §1B; verified by
#    tests/unit/test_packaging_wheel.py, which builds a real wheel).
#
#    The settings descriptions (data/domains, data/panels) go here too rather
#    than inside the package, because that is where the loader already looks:
#    gtheme.panels.loader.data_dir() searches "<XDG data dir>/gtheme" after the
#    checkout, so an installed package finds /usr/share/gtheme/{domains,panels}
#    with no code change. (Running from a checkout it finds ./data first.)
[tool.hatch.build.targets.wheel.shared-data]
"data/domains" = "share/gtheme/domains"
"data/panels" = "share/gtheme/panels"
"data/io.github.blyatiful1.Gtheme.desktop" = "share/applications/io.github.blyatiful1.Gtheme.desktop"
"data/io.github.blyatiful1.Gtheme.metainfo.xml" = "share/metainfo/io.github.blyatiful1.Gtheme.metainfo.xml"
"data/icons/hicolor" = "share/icons/hicolor"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # function call in default arg — Gtk idioms use it
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# core_*.py and system_*.py are dedicated suites (Wave-1 naming); pytest's default
# python_files would silently skip them, so widen it to collect every intended file.
python_files = ["test_*.py", "*_test.py", "core_*.py", "system_*.py"]
# The sandbox tier boots a real headless GNOME Shell and is LOCAL ONLY; it is
# never part of a plain `pytest` run and never runs in CI. `verify.sh --full`
# opts into it explicitly.
#
# The `dconf` tier is NOT excluded, on purpose. It needs a private
# dbus-run-session and the dconf-service that bus activates — no shell, no
# compositor, no seat — so it runs everywhere a plain `pytest` does, including
# CI and the packaged check(). Before that split (review-report M20) the only
# assertions that the two settings backends *write* alike lived in a tier
# nobody ever ran.
addopts = '-m "not sandbox"'
markers = [
    "gtk: needs GTK4/libadwaita and a usable display (offscreen is fine)",
    "dconf: needs a private dbus-run-session + dconf-service, no shell (runs in CI)",
    "sandbox: needs a private dbus-run-session + headless gnome-shell (LOCAL ONLY, never CI)",
    "mutating: writes real settings/files — SKIPPED unless an isolation seam is active",
]
