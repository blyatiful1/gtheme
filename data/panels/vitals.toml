# Vitals — live temperature, memory and network readings in the top bar.
id = "vitals"

[target]
uuids = ["Vitals@CoreCoding.com"]
ego_pk = 1460
schema_id = "org.gnome.shell.extensions.vitals"
conflicts = ["tophat@fflewddur.github.io"]
category = "system readings"
summary = "Puts live readings — processor temperature, memory in use, fan speed, network traffic — right in the bar at the top of the screen."

[[rows]]
schema_id = "org.gnome.shell.extensions.vitals"
key = "show-processor"
title = "Show processor use"
subtitle = "How hard the computer's brain is working, as a percentage."
synonyms = ["cpu", "processor", "load"]
kind = "toggle"

[[rows]]
schema_id = "org.gnome.shell.extensions.vitals"
key = "show-memory"
title = "Show memory use"
subtitle = "How much of the computer's working memory is in use."
synonyms = ["ram", "memory"]
kind = "toggle"

[[rows]]
schema_id = "org.gnome.shell.extensions.vitals"
key = "show-temperature"
title = "Show temperatures"
subtitle = "How hot the parts inside the computer are running."
synonyms = ["heat", "temperature", "celsius"]
kind = "toggle"

[[rows]]
schema_id = "org.gnome.shell.extensions.vitals"
key = "show-network"
title = "Show network traffic"
subtitle = "How much is being sent and received over your internet connection."
synonyms = ["internet", "network", "download speed"]
kind = "toggle"

[[rows]]
schema_id = "org.gnome.shell.extensions.vitals"
key = "show-fan"
title = "Show fan speeds"
subtitle = "How fast the cooling fans inside the computer are spinning."
kind = "toggle"

[[rows]]
schema_id = "org.gnome.shell.extensions.vitals"
key = "show-gpu"
title = "Show graphics card readings"
subtitle = "Temperature and load for the part of the computer that draws the picture."
synonyms = ["gpu", "graphics"]
kind = "toggle"

[[rows]]
schema_id = "org.gnome.shell.extensions.vitals"
key = "unit"
title = "Temperature scale"
subtitle = "Show temperatures in degrees Celsius or degrees Fahrenheit."
kind = "choice"
[[rows.choices]]
value = "0"
label = "Celsius"
[[rows.choices]]
value = "1"
label = "Fahrenheit"

[[rows]]
schema_id = "org.gnome.shell.extensions.vitals"
key = "update-time"
title = "How often the readings refresh"
subtitle = "The number of seconds between updates. Shorter means more up to date and a little more work for the computer."
kind = "slider"
clamp_min = 1
clamp_max = 60
step = 1

[[rows]]
schema_id = "org.gnome.shell.extensions.vitals"
key = "position-in-panel"
title = "Where the readings sit"
subtitle = "Which part of the bar at the top the readings appear in."
kind = "choice"
[[rows.choices]]
value = "0"
label = "Left"
[[rows.choices]]
value = "1"
label = "Middle"
[[rows.choices]]
value = "2"
label = "Right"

[[rows]]
schema_id = "org.gnome.shell.extensions.vitals"
key = "hide-zeros"
title = "Hide readings that show nothing"
subtitle = "Leaves out any reading that is sitting at zero, to keep the top bar tidy."
kind = "toggle"
advanced = true

[[rows]]
schema_id = "org.gnome.shell.extensions.vitals"
key = "use-higher-precision"
title = "Show more decimal places"
subtitle = "Adds another digit to every reading."
kind = "toggle"
advanced = true
