# this list cannot grow by accident.
[delegated]
"org.gnome.desktop.input-sources:sources" = "Which keyboard languages you type in. Choosing one needs the full list of the world's keyboard layouts, live previews of each, and the typing-language switcher in the top bar — all of which the desktop's own Settings app already provides. gtheme links there instead of shipping a second, worse copy."
"org.gnome.desktop.input-sources:xkb-options" = "Fine-grained keyboard behaviour (which key acts as Compose, where Ctrl sits). It is only meaningful next to the layout list above, which the desktop's own Settings app owns."
"org.gnome.desktop.input-sources:xkb-model" = "The physical shape of your keyboard, chosen next to the layout list the desktop's own Settings app owns."
"org.gnome.desktop.input-sources:per-window" = "Whether the typing language is remembered per window. Belongs with the layout list."
"org.gnome.desktop.input-sources:show-all-sources" = "Whether every keyboard language in the world is offered, or only likely ones. Belongs with the layout list."
"org.gnome.desktop.input-sources:current" = "Which keyboard language is in use right now. It is switched from the top bar, not set in a settings window."
"org.gnome.desktop.input-sources:mru-sources" = "The order keyboard languages were last used in, kept by the desktop itself as you switch."
