# coverage.toml — the promise that nothing was left out, as data.
#
# DESIGN.md A7 and F14. Every key of data/domains/universe.txt — read off a live
# GNOME 50 desktop — carries exactly one disposition below, from a closed set:
#
#   surfaced(<page>)   a hand-written row on that page of the app. The row lives in
#                      one of the data/domains/*.toml files and says, in plain words,
#                      what the setting does.
#   compound(<op>)     not a row: this key is written together with another one by a
#                      single control. Dark mode writes two keys; the text-sharpness
#                      control has to flip a second key first; turning an add-on on
#                      merges into a list. Splitting these into rows would ship
#                      controls that look like they work and do nothing.
#   floor              no hand-written row, but the setting still appears — More
#                      Settings renders it from the system's own description, marked
#                      as system text. This is the catch-all that makes the promise
#                      hold for the long tail.
#   excluded(<reason>) deliberately not shown at all. Only two reasons are legal, and
#                      a test enforces that: dead-key-§1.6 (in the settings list but
#                      nothing on a modern desktop reads it) and obsolete-recipe-§9.6
#                      (advice that used to be true and would now do harm).
#   delegated(<who>)   the desktop's own Settings app owns this and does it better.
#                      Legal only for the entries in [delegated] below, each with a
#                      justification. Keyboard shortcuts may never be delegated.
#
# A key with no disposition fails tests/unit/domains_test_coverage.py. That test is
# the whole point: the app's surface cannot be quietly narrowed.

[dispositions]

