# gtheme domain descriptors — core GNOME, authored by hand.
#
# Every row here is dispositioned surfaced(more) in coverage.toml.
# Titles and subtitles are checked by the plain-language lint in
# tests/unit/domains_jargon_test.py; synonyms deliberately are not, because they
# exist to catch the words a person actually types into the search box.

id = "wellbeing"
title = "Breaks & Screen Time"

[[rows]]
schema_id = "org.gnome.desktop.break-reminders.eyesight"
key = "interval-seconds"
title = "Eyesight break: how often"
subtitle = "How long you work before your desktop reminds you to look away, in seconds."
synonyms = ["break", "reminder", "eyesight", "wellbeing"]
kind = "slider"
clamp_min = 60
clamp_max = 21600
step = 60

[[rows]]
schema_id = "org.gnome.desktop.break-reminders.eyesight"
key = "duration-seconds"
title = "Eyesight break: how long"
subtitle = "How long the break lasts, in seconds."
synonyms = ["break", "reminder", "eyesight"]
kind = "slider"
clamp_min = 10
clamp_max = 3600
step = 10

[[rows]]
schema_id = "org.gnome.desktop.break-reminders.eyesight"
key = "delay-seconds"
title = "Eyesight break: how long you may put it off"
subtitle = "How much longer you get when you postpone the break, in seconds."
synonyms = ["break", "snooze", "eyesight"]
kind = "slider"
clamp_min = 10
clamp_max = 3600
step = 10
advanced = true

[[rows]]
schema_id = "org.gnome.desktop.break-reminders.eyesight"
key = "countdown"
title = "Eyesight break: count the break down"
subtitle = "Shows the seconds ticking away while the break is running."
synonyms = ["break", "countdown", "eyesight"]
kind = "toggle"

[[rows]]
schema_id = "org.gnome.desktop.break-reminders.eyesight"
key = "fade-screen"
title = "Eyesight break: fade the screen"
subtitle = "Dims the screen while the break runs, so it is harder to keep working through it."
synonyms = ["break", "fade", "dim", "eyesight"]
kind = "toggle"

[[rows]]
schema_id = "org.gnome.desktop.break-reminders.eyesight"
