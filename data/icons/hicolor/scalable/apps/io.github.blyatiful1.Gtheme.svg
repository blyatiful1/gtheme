<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#8f6ee8"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e4e4ea"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9e07f"/>
      <stop offset="0.45" stop-color="#f6d32d"/>
      <stop offset="1" stop-color="#e5a50a"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6f5f4"/>
      <stop offset="0.45" stop-color="#c0bfbc"/>
      <stop offset="1" stop-color="#9a9996"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7800"/>
      <stop offset="1" stop-color="#e01b24"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>

  <!-- the window being restyled -->
  <g>
    <rect x="25" y="26" width="64" height="52" rx="9" fill="url(#paper)"/>
    <path d="M25 35a9 9 0 0 1 9-9h46a9 9 0 0 1 9 9v6H25z" fill="#b6b6c2"/>
    <circle cx="35" cy="33.5" r="3.2" fill="#ffffff"/>
    <circle cx="45" cy="33.5" r="3.2" fill="#ffffff"/>
    <rect x="34" y="50" width="34" height="6" rx="3" fill="#b6b6c2"/>
    <rect x="34" y="61" width="22" height="6" rx="3" fill="#cfcfd8"/>
  </g>

  <!-- the paint stroke it just got -->
  <path d="M34 86c14-10 34-10 48-2" fill="none" stroke="url(#paint)" stroke-width="11"
        stroke-linecap="round" opacity="0.95"/>

  <!-- the brush -->
  <g transform="translate(-4 0) rotate(30 84 92)">
    <rect x="78" y="37" width="12" height="35" rx="6" fill="url(#handle)"/>
    <path d="M78 68h12v6l3 4H75l3-4z" fill="url(#metal)"/>
    <rect x="75" y="78" width="18" height="10" rx="2" fill="url(#metal)"/>
    <path d="M76 88h16l-3 14a5 5 0 0 1-10 0z" fill="url(#paint)"/>
  </g>
