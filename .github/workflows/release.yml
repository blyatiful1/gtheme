name: release

# Tag a version (git tag v0.1.0 && git push --tags) and this builds the
# package, creates the GitHub release with the artifacts attached, and
# publishes to PyPI via Trusted Publishing (configure the publisher once at
# pypi.org: project `gtheme`, owner `blyatiful1`, repo `gtheme`,
# workflow `release.yml`, environment `pypi` — no API token needed).

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test before shipping
        run: python -m pip install .[dev] && python -m pytest -q
      - name: Build
        run: python -m pip install build twine && python -m build && python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
