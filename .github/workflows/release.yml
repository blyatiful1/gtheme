name: release

# Tag a version (git tag v2.0.0 && git push --tags) and this builds the
# installable package and creates the GitHub release with it attached.
#
# gtheme v2 is NOT published to PyPI. It is a graphical app whose graphical
# half comes from the distribution (PyGObject, GTK 4, libadwaita), so a
# `pip install gtheme` would look like it worked and then fail to start. The
# supported routes are the Arch package (PKGBUILD) and install.sh from a
# checkout; the wheel attached here is what the PKGBUILD's build step produces
# and what packagers for other distributions should start from.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Nothing ships that the suite has not passed on, and the suite needs a
  # GNOME 50 userspace and a session bus to mean anything — see the long note
  # at the top of ci.yml. This is that job, and the wheel waits for it.
  tests:
    name: the suite (Arch container, GNOME 50)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm \
            python python-gobject gtk4 libadwaita glib2 dconf libsoup3 \
            gsettings-desktop-schemas gnome-desktop-4 gnome-settings-daemon \
            mutter gnome-shell gnome-backgrounds \
            desktop-file-utils appstream \
            python-pip python-hatchling dbus git
      - uses: actions/checkout@v4
      - name: Install gtheme
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Test before shipping
        run: |
          gtk4-broadwayd :5 &
          sleep 2
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 \
            dbus-run-session -- .venv/bin/python -m pytest -q -m "not sandbox"

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The wheel is pure Python; only the launcher entry and the store listing
      # need checking here, and neither needs a desktop. Every tier that does —
      # including `dconf`, which needs a private bus and the dconf-service that
      # bus activates (M20) — ran in the `tests` job above, wrapped in
      # dbus-run-session exactly as verify.sh wraps it (M16). Shipping a tag is
      # the last place that should be deciding from a borrowed session bus.
      - name: Install the packaging checkers
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream

      - name: Check the launcher entry and the store listing
        run: |
          desktop-file-validate data/io.github.blyatiful1.Gtheme.desktop
          appstreamcli validate --no-net data/io.github.blyatiful1.Gtheme.metainfo.xml

      - name: Build the wheel
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          .venv/bin/python -m pip install build
          .venv/bin/python -m build --wheel

      - name: Check the wheel carries its data files
        run: .venv/bin/python -m pytest -q tests/unit/test_packaging_wheel.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub release with the wheel attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
