name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# READ THIS BEFORE TRUSTING A GREEN TICK.
#
# What CI proves is strictly LESS than what `./verify.sh --full` proves on a
# real machine. Green here means: the code lints, the pure-Python tier passes,
# the packaging is well-formed, and the widgets build under GTK 4 / libadwaita.
#
# It does NOT prove any of the following, all of which only the local canonical
# check covers:
#   * the sandbox tier — it boots a real headless GNOME Shell on a private
#     dbus session. It is deliberately never run here, at any cost in coverage.
#   * the page-walk screenshots, and the honesty gate over them.
#   * that applying and undoing a look really moves a real desktop.
#   * that the machine this was built on came out unchanged (F16).
#
# The `dconf` tier DOES run here, in both jobs, and used not to: a private bus
# plus the dconf-service it activates is all it needs, and that is exactly what
# `dbus-run-session` provides. So a GioBackend that spells a written value
# differently from the subprocess backend now fails here rather than waiting
# for someone to run the local-only tier (review-report M20).
# A change that is green here and has not been through ./verify.sh --full is
# unverified. See docs/testing.md.
jobs:
  lint-and-unit:
    name: ruff + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # F10: core/ may import Gio/GLib (a guard test forbids Gtk/Adw there), so
      # the unit tier needs PyGObject with the GLib typelib. libglib2.0-bin
      # provides glib-compile-schemas, which the settings-backend tests use to
      # build a throwaway schema. The last three are what the packaging tests
      # check the launcher entry, the store listing and the icons with — without
      # them those tests skip themselves and prove nothing.
      # dbus + dconf-cli + dconf-gsettings-backend are what the `dconf` tier
      # needs: dbus-run-session to get a private bus, and a dconf-service on it
      # to write to. Without them that tier would skip itself with an honest
      # reason and prove nothing, which is the state M20 was about.
      - name: Install GLib bindings and the packaging checkers
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-glib-2.0 libglib2.0-bin \
                                  dbus dconf-cli dconf-gsettings-backend \
                                  desktop-file-utils appstream librsvg2-bin
      - name: Install gtheme
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - name: ruff
        run: .venv/bin/ruff check .
      - name: pytest
        # Ubuntu runners ship libadwaita 1.5; gtheme targets 1.9. No Adw code
        # may run here — that is the archlinux job's task. The unit tier
        # includes tests/unit/test_packaging_*.py, which builds a real wheel
        # and looks inside it.
        #
        # dbus-run-session, exactly as verify.sh does it (M16): the settings
        # phase decides whether to run from DBUS_SESSION_BUS_ADDRESS, and a
        # runner has no session bus at all, so without this every settings and
        # extension test would error rather than run.
        run: dbus-run-session -- .venv/bin/python -m pytest -q -m "not gtk and not sandbox"

  gtk:
    name: GTK/libadwaita tests (Arch container)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm \
            python python-gobject gtk4 libadwaita glib2 dconf libsoup3 \
            python-pip python-hatchling dbus git
      - uses: actions/checkout@v4
      - name: Install gtheme
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: pytest -m "gtk or dconf"
        # gtk4-broadwayd is an offscreen GDK backend: no X server, no
        # compositor, no Xvfb needed. dbus-run-session gives the tests a
        # private session bus so nothing reaches a real one.
        #
        # The `dconf` tier rides along here as well as in the unit job: this
        # container has the glib2/dconf the app actually targets, and the tier
        # asks for nothing else (no shell, no seat). Seven seconds.
        run: |
          gtk4-broadwayd :5 &
          sleep 2
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 \
            dbus-run-session -- .venv/bin/python -m pytest -q -m "gtk or dconf"
