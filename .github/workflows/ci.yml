name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        # Install the package itself (src-layout) so `python -m gtheme` and the
        # bundled themes resolve; jinja2/pydantic come in as declared deps.
        run: python -m pip install --upgrade pip && python -m pip install . pytest

      - name: Compile sources
        run: python -m compileall src

      - name: Run tests
        run: python -m pytest -q

      - name: Validate bundled themes
        run: python -m gtheme validate all
