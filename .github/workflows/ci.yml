name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# READ THIS BEFORE TRUSTING A GREEN TICK.
#
# What CI proves is strictly LESS than what `./verify.sh --full` proves on a
# real machine. Green here means: the code lints, the packaging is well-formed,
# and the suite passes against a GNOME 50 userspace with a private session bus.
#
# It does NOT prove any of the following, all of which only the local canonical
# check covers:
#   * the sandbox tier — it boots a real headless GNOME Shell on a private
#     dbus session. It is deliberately never run here, at any cost in coverage.
#   * the page-walk screenshots, and the honesty gate over them.
#   * that applying and undoing a look really moves a real desktop.
#   * that the machine this was built on came out unchanged (F16).
# A change that is green here and has not been through ./verify.sh --full is
# unverified. See docs/testing.md.
#
# WHY THE WHOLE SUITE RUNS IN THE ARCH CONTAINER AND NOT ON THE UBUNTU RUNNER.
# It was split the other way until the v2 rebuild, and the unit half could not
# pass there for three separate reasons, none of them about the code:
#   * with no PyGObject the page modules will not import, and the tests that
#     read a setting through GioBackend have nothing to read it with;
#   * with PyGObject but no session bus, every settings write is skipped with
#     "your desktop session wasn't running" — 19 failures that say nothing;
#   * with both, ubuntu-24.04's gsettings-desktop-schemas is GNOME 46, which
#     has no `accent-color` key and no org.gnome.shell, so a further 14 fail
#     for being a 2024 desktop rather than a 2026 one.
# The container is the machine gtheme targets. The ubuntu job keeps the two
# things that genuinely do not need a desktop: the linter and the packaging.
jobs:
  lint-and-packaging:
    name: ruff + packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # These three are what the packaging tests check the launcher entry, the
      # store listing and the icons with — without them those tests skip
      # themselves and prove nothing. No PyGObject here on purpose: nothing in
      # this job may need a desktop.
      - name: Install the packaging checkers
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream librsvg2-bin
      - name: Install gtheme
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - name: ruff
        run: .venv/bin/ruff check .
      - name: pytest — packaging only
        # Builds a real wheel and looks inside it, validates the .desktop file
        # and the metainfo, and checks what install.sh would put where.
        run: |
          .venv/bin/python -m pytest -q \
            tests/unit/test_packaging_wheel.py \
            tests/unit/test_packaging_desktop.py \
            tests/unit/test_packaging_install.py

  tests:
    name: the suite (Arch container, GNOME 50)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      # The GNOME lines are not decoration. Without them ten tests fail for the
      # container rather than for the code: the schemas the pages read
      # (org.gnome.shell, org.gnome.mutter, the settings-daemon plugins), the
      # GnomeDesktop-4.0 typelib the thumbnailer needs, and the wallpaper
      # catalogue under /usr/share/gnome-background-properties.
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm \
            python python-gobject gtk4 libadwaita glib2 dconf libsoup3 \
            gsettings-desktop-schemas gnome-desktop-4 gnome-settings-daemon \
            mutter gnome-shell gnome-backgrounds \
            desktop-file-utils appstream \
            python-pip python-hatchling dbus git
      - uses: actions/checkout@v4
      - name: Install gtheme
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: pytest
        # gtk4-broadwayd is an offscreen GDK backend: no X server, no
        # compositor, no Xvfb needed. dbus-run-session gives the tests a
        # private session bus so nothing reaches a real one — and so that the
        # transaction tests have a session to write into at all.
        #
        # -m "not sandbox" is both tiers at once: the sandbox tier is the only
        # one this file refuses to run, and pyproject already deselects it.
        run: |
          gtk4-broadwayd :5 &
          sleep 2
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 \
            dbus-run-session -- .venv/bin/python -m pytest -q -m "not sandbox"
