name: ci

on:
  push:
    branches: [main]
  pull_request:

# What CI proves is strictly LESS than what ./verify.sh --full proves locally.
# The sandbox tier boots a real headless GNOME Shell and touches a private
# dbus session; it is deliberately never run here. See docs/testing.md.
jobs:
  lint-and-unit:
    name: ruff + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # F10: core/ may import Gio/GLib (a guard test forbids Gtk/Adw there), so
      # the unit tier needs PyGObject with the GLib typelib. libglib2.0-bin
      # provides glib-compile-schemas, which the settings-backend tests use to
      # build a throwaway schema.
      - name: Install GLib bindings
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-glib-2.0 libglib2.0-bin
      - name: Install gtheme
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - name: ruff
        run: .venv/bin/ruff check .
      - name: pytest
        # Ubuntu runners ship libadwaita 1.5; gtheme targets 1.9. No Adw code
        # may run here — that is the archlinux job's task.
        run: .venv/bin/python -m pytest -q -m "not gtk and not sandbox"

  gtk:
    name: GTK/libadwaita tests (Arch container)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm \
            python python-gobject gtk4 libadwaita glib2 dconf libsoup3 \
            python-pip python-hatchling dbus git
      - uses: actions/checkout@v4
      - name: Install gtheme
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/python -m pip install -e '.[dev]'
      - name: pytest -m gtk
        # gtk4-broadwayd is an offscreen GDK backend: no X server, no
        # compositor, no Xvfb needed. dbus-run-session gives the tests a
        # private session bus so nothing reaches a real one.
        run: |
          gtk4-broadwayd :5 &
          sleep 2
          GDK_BACKEND=broadway BROADWAY_DISPLAY=:5 \
            dbus-run-session -- .venv/bin/python -m pytest -q -m gtk
