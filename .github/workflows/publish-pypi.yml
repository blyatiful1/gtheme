name: publish-pypi

# Manual, opt-in PyPI publish. Before the first run, configure Trusted
# Publishing once at pypi.org (Add a publisher: project `gtheme`, owner
# `blyatiful1`, repo `gtheme`, workflow `publish-pypi.yml`, environment
# `pypi`) — no API-token secret needed. Then: Actions → publish-pypi →
# Run workflow, entering the tag to publish (e.g. v0.1.0).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0)"
        required: true

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build from the tagged source
        run: python -m pip install build twine && python -m build && python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
