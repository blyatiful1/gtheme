name: Theme submission
description: Propose a theme for the bundled collection
labels: [theme]
body:
  - type: markdown
    attributes:
      value: |
        Themes are contributed as pull requests — this issue is for discussing
        one first. There is no publish command; the steps are manual and short:

        1. put your Look's folder, with its `theme.toml` and at least one
           screenshot, in `themes/<name>/`
        2. `./.venv/bin/python -m gtheme validate themes/<name>`
        3. `./.venv/bin/python tools/build_index.py` and commit the updated
           `themes/index.json`
        4. open the pull request

        CONTRIBUTING.md has the full submission checklist and
        docs/preset-format.md has the format, field by field.
  - type: input
    id: name
    attributes:
      label: Theme name + one-line description
    validations:
      required: true
  - type: textarea
    id: looks
    attributes:
      label: Screenshot
      description: A desktop screenshot or the palette. Visuals are the whole pitch.
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "`./.venv/bin/python -m gtheme validate themes/<name>` passes"
        - label: All art/assets are original or license-compatible, with attribution preserved
        - label: No hard-coded usernames, machine paths, or distro-only files
