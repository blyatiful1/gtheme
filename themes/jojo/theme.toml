# JoJo — STONE OCEAN (Part 6+) desktop theme.
# Generated by gtheme; palette in palette.toml.

[meta]
name = "jojo"
title = "STONE OCEAN"
description = "JoJo Part 6+: Stone Ocean / Steel Ball Run / JoJolion. No Part 1-5."
author = "crocco"
version = "1.0.0"
based_on = "nsx"

[requires]
packages = ["alacritty", "starship", "btop", "micro", "fastfetch", "papirus-icon-theme", "papirus-folders"]
extensions = ["dash-to-dock@micxgx.gmail.com", "blur-my-shell@aunetx", "just-perfection-desktop@just-perfection", "logomenu@aryan_k", "tilingshell@ferrarodomenico.com"]
fonts = ["MesloLGS Nerd Font"]

[build]
managed = ["terminal", "monitor", "editor", "gtk"]

[[files]]
component = "wallpaper"
src = "files/wallpaper/stone-ocean.png"
dest = "~/.local/share/backgrounds/jojo/stone-ocean.png"

[[files]]
component = "wallpaper"
src = "files/wallpaper/golden-spin.png"
dest = "~/.local/share/backgrounds/jojo/golden-spin.png"

[[files]]
component = "wallpaper"
src = "files/wallpaper/soft-and-wet.png"
dest = "~/.local/share/backgrounds/jojo/soft-and-wet.png"

[[files]]
component = "wallpaper"
src = "files/wallpaper/jojo-slideshow.xml"
dest = "~/.local/share/backgrounds/jojo/jojo-slideshow.xml"
# Rendered through {{ home }} substitution at apply time so the slideshow
# resolves to the running user's backgrounds dir, not the author's.
template = true

[[files]]
component = "terminal"
src = "files/ptyxis/JoJo.palette"
dest = "~/.local/share/org.gnome.Ptyxis/palettes/JoJo.palette"

[[files]]
component = "terminal"
src = "files/alacritty/jojo.toml"
dest = "~/.config/alacritty/jojo.toml"

[[files]]
component = "terminal"
src = "files/alacritty/alacritty.toml"
dest = "~/.config/alacritty/alacritty.toml"

[[files]]
component = "prompt"
src = "files/starship.toml"
dest = "~/.config/starship.toml"

[[files]]
component = "monitor"
src = "files/btop/jojo.theme"
dest = "~/.config/btop/themes/jojo.theme"

[[files]]
component = "monitor"
src = "files/btop/btop.conf"
dest = "~/.config/btop/btop.conf"

[[files]]
component = "editor"
src = "files/micro/jojo.micro"
dest = "~/.config/micro/colorschemes/jojo.micro"

[[files]]
component = "editor"
src = "files/micro/settings.json"
dest = "~/.config/micro/settings.json"

[[files]]
component = "fastfetch"
src = "files/fastfetch/jojo-logo.txt"
dest = "~/.config/fastfetch/jojo-logo.txt"

[[files]]
component = "fastfetch"
src = "files/fastfetch/config.jsonc"
dest = "~/.config/fastfetch/config.jsonc"

[[files]]
component = "gtk"
src = "files/gtk/gtk.css"
dest = "~/.config/gtk-4.0/gtk.css"

[[files]]
component = "gtk"
src = "files/gtk/gtk.css"
dest = "~/.config/gtk-3.0/gtk.css"

[[files]]
component = "shell"
src = "files/shell/joestar-star.svg"
dest = "~/.local/share/gtheme/assets/jojo/joestar-star.svg"

[[files]]
component = "shell-cfg"
src = "files/fish/config.fish"
dest = "~/.config/fish/config.fish"

[[files]]
component = "commands"
src = "files/bin"
dest = "~/.local/share/gtheme/themes/jojo/bin"
mode = "755"

[[files]]
component = "ascii"
src = "files/ascii"
dest = "~/.local/share/gtheme/themes/jojo/ascii"

[[settings]]
component = "desktop"
backend = "gsettings"
key = "org.gnome.desktop.interface accent-color"
value = "'green'"

[[settings]]
component = "desktop"
backend = "gsettings"
key = "org.gnome.desktop.interface icon-theme"
# Papirus-Dark with folders recoloured green (papirus-folders -C green -t Papirus-Dark).
# Package install + recolour are a one-time sudo step; see [requires].packages.
value = "'Papirus-Dark'"

[[settings]]
component = "terminal"
backend = "dconf"
key = "/org/gnome/Ptyxis/Profiles/{{ ptyxis_default_profile }}/palette"
value = "'JoJo'"

[[settings]]
component = "terminal"
backend = "gsettings"
key = "org.gnome.Ptyxis use-system-font"
value = "false"

[[settings]]
component = "terminal"
backend = "gsettings"
key = "org.gnome.Ptyxis font-name"
value = "'MesloLGS Nerd Font Mono 11'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background picture-uri"
value = "'file://{{ home }}/.local/share/backgrounds/jojo/jojo-slideshow.xml'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background picture-uri-dark"
value = "'file://{{ home }}/.local/share/backgrounds/jojo/jojo-slideshow.xml'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background picture-options"
value = "'zoom'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background primary-color"
value = "'#0B0E18'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/dock-position"
value = "'LEFT'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/transparency-mode"
value = "'FIXED'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-background-color"
value = "true"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/background-color"
value = "'#151A2C'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/background-opacity"
value = "0.75"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/running-indicator-style"
value = "'DOTS'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-customize-running-dots"
value = "true"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-color"
value = "'#7DC75B'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-border-color"
value = "'#7DC75B'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-border-width"
value = "1"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/dash-to-dock/override-background"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/Logo-menu/use-custom-icon"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/Logo-menu/custom-icon-path"
value = "'{{ home }}/.local/share/gtheme/assets/jojo/joestar-star.svg'"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/Logo-menu/symbolic-icon"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/just-perfection/startup-status"
value = "0"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/enable-window-border"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/window-border-width"
value = "uint32 0"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/window-border-color"
value = "'#7DC75B'"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/blur"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/enable-all"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/whitelist"
value = "['Alacritty']"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/sigma"
value = "24"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/static-blur"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/dynamic-opacity"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/corner-radius"
value = "12"

[[hooks]]
event = "post"
component = "boot"
sudo = true
optional = true
script = "hooks/install-boot.sh"
restore = "hooks/restore-boot.sh"
