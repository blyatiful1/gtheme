# JoJo — Stone Ocean (JoJo's Bizarre Adventure, Part 6+) theme for Alacritty (v0.15)
# Ocean-abyss background, Jolyne-green cursor, Stand-string blue,
# Golden-Spin gold and Pucci purple. Yare yare dawa.

[colors.primary]
background        = "#0B0E18"
foreground        = "#E8EAF2"
dim_foreground    = "#C9CEDD"
bright_foreground = "#F4F5FB"

[colors.cursor]
text   = "#0B0E18"
cursor = "#7DC75B"

[colors.vi_mode_cursor]
text   = "#0B0E18"
cursor = "#E8B33F"

[colors.search.matches]
foreground = "#0B0E18"
background = "#E8B33F"

[colors.search.focused_match]
foreground = "#0B0E18"
background = "#FF7AB8"

[colors.footer_bar]
foreground = "#E8EAF2"
background = "#202741"

[colors.hints.start]
foreground = "#0B0E18"
background = "#FFD24A"

[colors.hints.end]
foreground = "#F4F5FB"
background = "#9A6BD4"

[colors.selection]
text       = "CellForeground"
background = "#2D452C"

[colors.normal]
black   = "#1A2030"
red     = "#E8435A"
green   = "#7DC75B"
yellow  = "#E8B33F"
blue    = "#4FA8E8"
magenta = "#9A6BD4"
cyan    = "#45D4C4"
white   = "#C9CEDD"

[colors.bright]
black   = "#4A5370"
red     = "#FF6478"
green   = "#9BE87A"
yellow  = "#FFD24A"
blue    = "#74C0FF"
magenta = "#B98FE8"
cyan    = "#74F0E0"
white   = "#F4F5FB"

[colors.dim]
black   = "#10141E"
red     = "#A73041"
green   = "#5A8F42"
yellow  = "#A7812E"
