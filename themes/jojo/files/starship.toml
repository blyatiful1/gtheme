# ──────────────────────────────────────────────────────────────────────
#  STONE OCEAN — ora ora prompt
#  JoJo's Bizarre Adventure, Part 6 and onwards: Jolyne's string-green,
#  Golden-Spin gold, Whitesnake purple over a deep-sea night cell.
#  "Yare yare dawa."
#
#  Powerline chain (sharp wedges, like Stone Free's strings):
#    green JoJo badge > gold star-plate directory > git on surface >
#    toolchain in Stand-string blue > abyss clock > battery warning lamp
#  Font: MesloLGS Nerd Font (all glyphs verified against its cmap).
# ──────────────────────────────────────────────────────────────────────

"$schema" = 'https://starship.rs/config-schema.json'

# Keep it fast: short module timeout, no network-dependent modules.
command_timeout = 500
scan_timeout = 30
add_newline = true

palette = 'jojo'

format = """
[](fg:jolyne_green)\
[  JoJo ](bold bg:jolyne_green fg:ocean_abyss)\
$username\
[](fg:jolyne_green bg:spin_gold)\
$directory\
[](fg:spin_gold bg:surface2)\
$git_branch\
$git_status\
[](fg:surface2 bg:surface1)\
$nodejs\
$rust\
$python\
$golang\
$c\
$docker_context\
[](fg:surface1 bg:ocean_abyss)\
$time\
[](fg:ocean_abyss)\
$battery\
$cmd_duration\
$line_break\
$character"""

[palettes.jojo]
# Deep sea & prison surfaces
ocean_abyss    = '#0B0E18'   # deepest background (deep sea / night prison)
surface1       = '#151A2C'
surface2       = '#202741'
moonlight      = '#E8EAF2'   # main foreground text
moonlight_dim  = '#C9CEDD'
# Stand colors
jolyne_green   = '#7DC75B'   # PRIMARY accent (Jolyne's hair buns)
jolyne_bright  = '#9BE87A'
stone_free     = '#4FA8E8'   # Stand-string blue
stone_bright   = '#74C0FF'
pucci_purple   = '#9A6BD4'   # Whitesnake/Pucci purple
pucci_bright   = '#B98FE8'
spin_gold      = '#E8B33F'   # Steel Ball Run Golden-Spin gold
spin_bright    = '#FFD24A'
johnny_pink    = '#E8559A'   # SBR pink / manga pop accent
johnny_bright  = '#FF7AB8'
ocean_teal     = '#45D4C4'   # sea cyan
teal_bright    = '#74F0E0'
menace_red     = '#E8435A'   # errors / warnings
menace_bright  = '#FF6478'
# ANSI set (named overrides: 'red', 'white' etc. resolve to these)
black          = '#1A2030'
black_bright   = '#4A5370'
red            = '#E8435A'
red_bright     = '#FF6478'
green          = '#7DC75B'
green_bright   = '#9BE87A'
yellow         = '#E8B33F'
yellow_bright  = '#FFD24A'
blue           = '#4FA8E8'
blue_bright    = '#74C0FF'
magenta        = '#9A6BD4'
magenta_bright = '#B98FE8'
cyan           = '#45D4C4'
cyan_bright    = '#74F0E0'
white          = '#C9CEDD'
white_bright   = '#F4F5FB'

# Green badge extras: only appears for root / SSH / user switch.
[username]
show_always = false
style_user = 'bg:jolyne_green fg:ocean_abyss'
style_root = 'bold bg:jolyne_green fg:menace_red'
format = '[$user ]($style)'

# Gold star plate: directory (Joestar birthmark gold).
[directory]
style = 'fg:ocean_abyss bg:spin_gold'
read_only_style = 'fg:menace_red bg:spin_gold'
read_only = ' '
format = '[ $path ]($style)[$read_only]($read_only_style)'
truncation_length = 3
truncation_symbol = '…/'

[directory.substitutions]
'Documents' = '󰈙 '
'Downloads' = ' '
'Music' = '󰝚 '
'Pictures' = ' '
'Developer' = '󰲋 '

# Git on Surface 2, Pucci-purple branch glyph, gold spin status.
[git_branch]
symbol = ''
style = 'bg:surface2'
format = '[ ](bg:surface2)[$symbol](bold fg:pucci_bright bg:surface2)[ $branch ](fg:moonlight bg:surface2)'

[git_status]
style = 'bg:surface2'
format = '[($all_status$ahead_behind )](fg:spin_gold bg:surface2)'

# Toolchain in Stand-string blue on Surface 1.
[nodejs]
symbol = ''
style = 'bg:surface1'
format = '[ $symbol( $version) ](fg:stone_free bg:surface1)'

[rust]
symbol = ''
style = 'bg:surface1'
format = '[ $symbol( $version) ](fg:stone_free bg:surface1)'

[python]
symbol = ''
style = 'bg:surface1'
format = '[ $symbol( $version) ](fg:stone_free bg:surface1)'

[golang]
symbol = ''
style = 'bg:surface1'
format = '[ $symbol( $version) ](fg:stone_free bg:surface1)'

[c]
symbol = ''
style = 'bg:surface1'
format = '[ $symbol( $version) ](fg:stone_free bg:surface1)'

# Quiet unless a docker context is actually configured.
[docker_context]
symbol = ''
style = 'bg:surface1'
only_with_files = true
format = '[ $symbol( $context) ](fg:stone_free bg:surface1)'

# Cell-block clock: time, dim moonlight on the abyss.
[time]
disabled = false
time_format = '%R'
style = 'bg:ocean_abyss'
format = '[ 󰓅 $time ](fg:moonlight_dim bg:ocean_abyss)'

# Dash warning lamp: battery (laptop).
# Hidden above 25%; spin gold 16-25%, menace red at 15% and below.
[battery]
full_symbol = ' '
charging_symbol = ' '
discharging_symbol = ' '
unknown_symbol = ' '
empty_symbol = ' '
format = '[ $symbol$percentage]($style)'

[[battery.display]]
threshold = 15
style = 'bold fg:menace_bright'

[[battery.display]]
threshold = 25
style = 'fg:spin_gold'

# Lap time: only when slow, Golden-Spin gold.
[cmd_duration]
min_time = 2000
style = 'bold fg:spin_gold'
format = '[ 󰔟 $duration]($style)'

# Stand cry: prompt character (vim-aware).
[character]
disabled = false
success_symbol = '[❯](bold fg:jolyne_green)'
error_symbol = '[YARE YARE](bold fg:menace_red) [❯](bold fg:menace_red)'
vimcmd_symbol = '[❮](bold fg:stone_free)'
vimcmd_replace_one_symbol = '[❮](bold fg:spin_gold)'
vimcmd_replace_symbol = '[❮](bold fg:spin_gold)'
vimcmd_visual_symbol = '[❮](bold fg:pucci_purple)'

[line_break]
disabled = false

# Explicitly parked (cloud/cluster noise, keeps the prompt fast).
[kubernetes]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true
