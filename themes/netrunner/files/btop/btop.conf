#? Config file for btop v.1.4.7 — NETRUNNER.
#? btop fills in any option not listed here with its default and rewrites
#? this file on exit; only the settings the theme cares about are pinned.

#* HUD palette (generated from palette.toml).
color_theme = "netrunner"

#* False so the terminal's glass (opacity + blur) shows through the gauges.
theme_background = false

#* Palette is authored in 24-bit; no quantising the neon.
truecolor = true

#* Rounded corners on the gauge boxes.
rounded_corners = true

#* Braille graphs: the sharpest scanline a font can render.
graph_symbol = "braille"

#* All four gauges: core, mem, net, procs.
shown_boxes = "cpu mem net proc"

#* Refresh rate.
update_ms = 1500

#* Processes as a tree, sorted by load.
proc_tree = false
proc_sorting = "cpu lazy"
proc_gradient = true

#* Battery meter (laptops).
show_battery = true

#* Celsius.
temp_scale = "celsius"
