;   ~/.config/spicetify/Themes/marketplace/color.ini
; Activate with: spicetify config color_scheme netrunner && spicetify apply
; (Key set is spicetify's standard scheme keys, documented in
;  ~/.spicetify/Themes/SpicetifyDefault/color.ini.)

