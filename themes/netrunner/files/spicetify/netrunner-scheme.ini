sidebar            = 111A2C
player             = 111A2C
card               = 19243A
shadow             = 060B14
selected-row       = 10C8D8
button             = 10C8D8
button-active      = 63EDF8
button-disabled    = 19243A
tab-active         = 19243A
notification       = 19243A
notification-error = FF3D5E
misc               = FCEE0A
