# HYPERCLASS — Gilded Void palette. ~12 named roles drive the render engine.
# First class aboard a starliner: champagne brass on deep-space ink, ivory
# starlight, one vein of ice so the gold has something cool to shine against.
#
# Craft notes (kept deliberately, they are the theme):
#   - bg is ink with a blue lean, never pure black (flagship schemes sit at
#     HSL L 9-23%; this is the dark end of that band).
#   - the gold is the desaturated #C69B3C..#D4AF37 "expensive" band — bright
#     #FFD700 is the slot-machine failure mode.
#   - two saturated accent families only: warm brass, cool ice. Everything
#     else is tuned to recede.
bg = "#12151F"
surface1 = "#1A1E2C"
surface2 = "#232838"
fg = "#EAE3D1"
fg_bright = "#FBF6E7"
fg_dim = "#C2BCAB"
accent = "#C9A24A"
accent_bright = "#E9CD8A"
warn = "#D98E48"
error = "#E2707F"
info = "#8FC6D8"
selection = "#2A3046"
comment = "#6E7488"
cursor = "#C9A24A"
# cabin materials (available to templates/overrides) — each one is consumed
# somewhere in the theme; nothing decorative rides for free.
champagne = "#EBD9A8"
gold = "#C9A24A"
platinum = "#C3C8D4"
ice = "#A9DAE8"
emerald = "#58B58D"

# ANSI terminal hues (drive the generated alacritty/ptyxis/btop palettes)
ansi_black = "#242A3C"
red = "#E2707F"
green = "#86C28F"
yellow = "#D9B45C"
blue = "#85ABE3"
magenta = "#B79BE0"
cyan = "#7CC5CE"
ansi_white = "#D3CDBE"
bright_black = "#6E7488"
bright_red = "#F18E9B"
bright_green = "#A3D8A9"
bright_yellow = "#EDCD82"
bright_blue = "#A6C4F2"
bright_magenta = "#CFB6EF"
bright_cyan = "#9ADEE6"
bright_white = "#FBF6E7"
