component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/Logo-menu/use-custom-icon"
value = "true"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/Logo-menu/custom-icon-path"
value = "'{{ home }}/.local/share/gtheme/assets/hyperclass/hyperclass-emblem.svg'"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/Logo-menu/symbolic-icon"
value = "false"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/just-perfection/startup-status"
value = "0"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/tilingshell/enable-window-border"
value = "true"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/tilingshell/window-border-width"
value = "uint32 2"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/tilingshell/window-border-color"
value = "'#C9A24A'"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/blur-my-shell/applications/blur"
value = "true"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/blur-my-shell/applications/enable-all"
value = "false"
component = "addons"

[[settings]]
