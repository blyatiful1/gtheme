component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/dash-to-dock/custom-background-color"
value = "true"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/dash-to-dock/background-color"
value = "'#1A1E2C'"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/dash-to-dock/background-opacity"
value = "0.68"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/dash-to-dock/running-indicator-style"
