component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/dash-to-dock/custom-theme-customize-running-dots"
value = "true"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-color"
value = "'#C9A24A'"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-border-color"
value = "'#EBD9A8'"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-border-width"
value = "1"
component = "addons"

[[settings]]
key = "dconf:/org/gnome/shell/extensions/blur-my-shell/dash-to-dock/override-background"
