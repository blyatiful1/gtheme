<?xml version="1.0" encoding="UTF-8"?>
<!-- HYPERCLASS — Gilded Void: a rising-sun sunburst fan for the Logo-menu icon.
     Brass beams over the horizon, one ice star crowning the crest. Flat matte
     fills only, tuned to still read as first-class at ~22px. Original artwork. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- the horizon rule the sun crests over -->
  <rect x="7" y="45.4" width="50" height="2.2" fill="#C9A24A"/>
  <!-- sunburst fan: 11 brass beams, tips landing on a clean semicircle -->
  <g fill="#C9A24A">
    <polygon points="27.46,43.64 8.45,37.31 7.26,41.75 26.89,45.77"/>
    <polygon points="28.22,42.55 11.50,31.51 9.20,35.49 27.12,44.45"/>
    <polygon points="29.24,41.69 15.95,26.70 12.70,29.95 27.69,43.24"/>
    <polygon points="30.45,41.12 21.49,23.20 17.51,25.50 28.55,42.22"/>
    <polygon points="31.77,40.89 27.75,21.26 23.31,22.45 29.64,41.46"/>
    <polygon points="33.10,41.00 34.30,21.00 29.70,21.00 30.90,41.00"/>
    <polygon points="34.36,41.46 40.69,22.45 36.25,21.26 32.23,40.89"/>
    <polygon points="35.45,42.22 46.49,25.50 42.51,23.20 33.55,41.12"/>
    <polygon points="36.31,43.24 51.30,29.95 48.05,26.70 34.76,41.69"/>
    <polygon points="36.88,44.45 54.80,35.49 52.50,31.51 35.78,42.55"/>
    <polygon points="37.11,45.77 56.74,41.75 55.55,37.31 36.54,43.64"/>
  </g>
  <!-- champagne crest disc: hides the beams' inner ends, anchors the fan -->
  <path fill="#EBD9A8" d="M24 46 A8 8 0 0 1 40 46 Z"/>
  <!-- the one cool vein: an ice star crowning the crest -->
  <polygon fill="#A9DAE8"
    points="32.00,8.50 33.48,14.52 39.50,16.00 33.48,17.48 32.00,23.50 30.52,17.48 24.50,16.00 30.52,14.52"/>
</svg>
