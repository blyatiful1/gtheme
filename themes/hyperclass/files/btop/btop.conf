#? Config file for btop v.1.4.7 — HYPERCLASS Gilded Void.
#? btop fills in any option not listed here with its default and rewrites
#? this file on exit; only the settings the theme cares about are pinned.

#* The engraved brass instrument panel (generated from palette.toml).
color_theme = "hyperclass"

#* False so the terminal's glass (opacity + blur) shows through the gauges.
theme_background = false

#* The palette is authored in 24-bit; never quantise the brass.
truecolor = true

#* Rounded bezels on the gauge boxes, like every good instrument cluster.
rounded_corners = true

#* Braille graphs: the finest engraving line available in a font.
graph_symbol = "braille"

#* All four gauges on the panel: engines, reserves, comms, manifest.
shown_boxes = "cpu mem net proc"

#* An unhurried sweep — first class does not fidget.
update_ms = 1500

#* Processes as a tree, sorted by hunger.
proc_tree = false
proc_sorting = "cpu lazy"
proc_gradient = true

#* Battery meter for those riding coach (laptops).
show_battery = true

#* Celsius, as on all civilised vessels.
temp_scale = "celsius"
