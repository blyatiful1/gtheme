# HYPERCLASS — Gilded Void: the window seat.
# Colours live in hyperclass.toml (generated from palette.toml — edit that).

[general]
import = ["~/.config/alacritty/hyperclass.toml"]

[env]
TERM = "xterm-256color"

[window]
# A whisper of the void through the glass; blur-my-shell frosts it on GNOME,
# `blur` covers compositors with native support.
opacity = 0.92
blur = true
dynamic_padding = true
# Generous negative space is a luxury signal — the cabin is never cramped.
padding = { x = 18, y = 16 }
decorations_theme_variant = "Dark"

[font]
size = 11.5

# Iosevka: narrow, tall, machine-age letterforms — the closest a terminal
# font gets to art-deco signage.
[font.normal]
family = "Iosevka Nerd Font Mono"
style  = "Regular"

[font.bold]
family = "Iosevka Nerd Font Mono"
style  = "Bold"

[font.italic]
family = "Iosevka Nerd Font Mono"
style  = "Italic"

[cursor]
unfocused_hollow = true
# A steady brass block — a cursor with the confidence not to blink.
style = { shape = "Block", blinking = "Off" }

[scrolling]
history = 10000

# Shift+Enter sends ESC + CR (escaped newline)
[[keyboard.bindings]]
key   = "Return"
mods  = "Shift"
chars = "\u001B\r"
