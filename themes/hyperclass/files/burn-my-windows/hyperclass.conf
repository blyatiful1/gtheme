# HYPERCLASS — Gilded Void profile for the Burn My Windows GNOME extension.
# Windows arrive and depart through a champagne hexagon lattice — the airlock
# iris. GLib keyfile read by the extension's GSettings keyfile backend; the
# gtheme manifest points the extension's `active-profile` dconf key here.
#
# BMW picks RANDOMLY among all enabled effects, so exactly one may be true —
# fire defaults to true in the extension's schema and must be pinned false.
[burn-my-windows-profile]
profile-app=''
profile-animation-type=0
profile-window-type=0
profile-color-scheme=0
profile-power-mode=0
profile-power-profile=0
profile-high-priority=false
fire-enable-effect=false
hexagon-enable-effect=true
hexagon-animation-time=750
hexagon-scale=2.0
hexagon-line-width=1.5
hexagon-line-color='rgba(235, 217, 168, 0.62)'
hexagon-glow-color='rgba(201, 162, 74, 0.35)'
hexagon-additive-blending=true
