# SHOJI — washi paper & sumi ink desktop theme.
# Generated by gtheme; palette in palette.toml.

[meta]
name = "shoji"
title = "SHOJI — Paper & Ink"
description = "Washi paper, sumi ink, one vermilion hanko. A quiet light-mode GNOME."
author = "blyatiful1"
version = "1.1.0"

[requires]
packages = ["alacritty", "starship", "btop", "micro", "fastfetch", "papirus-icon-theme", "ptyxis"]
extensions = ["dash-to-dock@micxgx.gmail.com", "blur-my-shell@aunetx", "just-perfection-desktop@just-perfection", "logomenu@aryan_k", "tilingshell@ferrarodomenico.com"]
fonts = ["MesloLGS Nerd Font"]

[build]
# Only the scheme-agnostic components are engine-managed. The shared
# terminal/gtk templates assume a dark palette (Ptyxis derives its [Light]
# section by inversion; gtk.css puts fg_bright on the accent), which turns a
# light design inside-out — those files are hand-authored instead.
managed = ["monitor", "editor"]

[[files]]
component = "wallpaper"
src = "files/wallpaper/enso.png"
dest = "~/.local/share/backgrounds/shoji/enso.png"

[[files]]
component = "wallpaper"
src = "files/wallpaper/ridgeline.png"
dest = "~/.local/share/backgrounds/shoji/ridgeline.png"

[[files]]
component = "wallpaper"
src = "files/wallpaper/washi.png"
dest = "~/.local/share/backgrounds/shoji/washi.png"

[[files]]
component = "wallpaper"
src = "files/wallpaper/take.png"
dest = "~/.local/share/backgrounds/shoji/take.png"

[[files]]
component = "terminal"
src = "files/alacritty/alacritty.toml"
dest = "~/.config/alacritty/alacritty.toml"

[[files]]
component = "terminal"
src = "files/alacritty/shoji.toml"
dest = "~/.config/alacritty/shoji.toml"

[[files]]
component = "terminal"
src = "files/ptyxis/Shoji.palette"
dest = "~/.local/share/org.gnome.Ptyxis/palettes/Shoji.palette"

[[files]]
component = "prompt"
src = "files/starship.toml"
dest = "~/.config/starship.toml"

[[files]]
component = "shell-cfg"
src = "files/fish/config.fish"
dest = "~/.config/fish/config.fish"

[[files]]
component = "monitor"
src = "files/btop/btop.conf"
dest = "~/.config/btop/btop.conf"

[[files]]
component = "monitor"
src = "files/btop/shoji.theme"
dest = "~/.config/btop/themes/shoji.theme"

[[files]]
component = "editor"
src = "files/micro/shoji.micro"
dest = "~/.config/micro/colorschemes/shoji.micro"

[[files]]
component = "editor"
src = "files/micro/settings.json"
dest = "~/.config/micro/settings.json"

[[files]]
component = "fastfetch"
src = "files/fastfetch/config.jsonc"
dest = "~/.config/fastfetch/config.jsonc"

[[files]]
component = "fastfetch"
src = "files/fastfetch/shoji-logo.txt"
dest = "~/.config/fastfetch/shoji-logo.txt"

[[files]]
component = "gtk"
src = "files/gtk/gtk.css"
dest = "~/.config/gtk-3.0/gtk.css"

[[files]]
component = "gtk"
src = "files/gtk/gtk.css"
dest = "~/.config/gtk-4.0/gtk.css"

[[files]]
component = "shell"
src = "files/shell/shoji-enso.svg"
dest = "~/.local/share/gtheme/assets/shoji/shoji-enso.svg"

[[settings]]
component = "desktop"
backend = "gsettings"
# GNOME's named accents have no vermilion; 'red' is the closest anchor for
# the parts of the shell gtk.css can't reach. Apps get the true hanko hue.
key = "org.gnome.desktop.interface accent-color"
value = "'red'"

[[settings]]
component = "desktop"
backend = "gsettings"
# NOTE: this is a LIGHT design — the one scheme every other theme here isn't.
# Set explicitly so dark-mode users see paper, not a half-applied theme.
key = "org.gnome.desktop.interface color-scheme"
value = "'default'"

[[settings]]
component = "desktop"
backend = "gsettings"
key = "org.gnome.desktop.interface icon-theme"
value = "'Papirus-Light'"

[[settings]]
component = "desktop"
backend = "gsettings"
# ma (間): nothing should trigger by accident. The desktop stays still
# until asked.
key = "org.gnome.desktop.interface enable-hot-corners"
value = "false"

[[settings]]
component = "desktop"
backend = "gsettings"
# the panel only appears in the overview now — when it does, say the day
key = "org.gnome.desktop.interface clock-show-weekday"
value = "true"

[[settings]]
component = "terminal"
backend = "dconf"
key = "/org/gnome/Ptyxis/Profiles/{{ ptyxis_default_profile }}/palette"
value = "'Shoji'"

[[settings]]
component = "terminal"
backend = "gsettings"
key = "org.gnome.Ptyxis use-system-font"
value = "false"

[[settings]]
component = "terminal"
backend = "gsettings"
key = "org.gnome.Ptyxis font-name"
value = "'MesloLGS Nerd Font Mono 11'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background picture-uri"
value = "'file://{{ home }}/.local/share/backgrounds/shoji/take.png'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background picture-uri-dark"
value = "'file://{{ home }}/.local/share/backgrounds/shoji/take.png'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background picture-options"
value = "'zoom'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background primary-color"
value = "'#F2EFE5'"

[[settings]]
component = "shell"
backend = "gsettings"
key = "org.gnome.shell enabled-extensions"
value = "['dash-to-dock@micxgx.gmail.com', 'blur-my-shell@aunetx', 'just-perfection-desktop@just-perfection', 'logomenu@aryan_k', 'tilingshell@ferrarodomenico.com']"

# ── dock: a sheet of paper resting at the bottom edge ──────────────────────

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/dock-position"
value = "'BOTTOM'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/intellihide"
value = "true"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/dock-fixed"
value = "false"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/transparency-mode"
value = "'FIXED'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-background-color"
value = "true"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/background-color"
value = "'#F2EFE5'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/background-opacity"
value = "0.72"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/apply-custom-theme"
value = "false"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/running-indicator-style"
value = "'DOTS'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-customize-running-dots"
value = "true"

[[settings]]
component = "dock"
backend = "dconf"
# hanko-red running dots: the only colour the dock is allowed.
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-color"
value = "'#B3402E'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-border-color"
value = "'#B3402E'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-border-width"
value = "1"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/extend-height"
value = "false"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/dash-max-icon-size"
value = "40"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/click-action"
value = "'minimize-or-overview'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/show-trash"
value = "false"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/show-mounts"
value = "false"

# ── blur-my-shell: frost only the terminal; the panel stays sumi-dark ──────
# (a blurred panel over paper turns white and drowns the shell's white text)

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/settings-version"
value = "2"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/panel/blur"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/dash-to-dock/override-background"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/overview/blur"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/overview/pipeline"
value = "'pipeline_default'"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/blur"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/enable-all"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/whitelist"
value = "['Alacritty']"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/sigma"
value = "20"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/static-blur"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/dynamic-opacity"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/corner-radius"
value = "12"

# ── just-perfection: remove what does not need to be there ─────────────────

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/just-perfection/animation"
value = "4"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/just-perfection/activities-button"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/just-perfection/startup-status"
value = "0"

# The boldest ma of all: no top panel on the desktop. The workspace is a
# bare sheet of paper; clock, network, battery and the enso menu appear
# the moment you enter the overview (Super). Revert with:
#   dconf write /org/gnome/shell/extensions/just-perfection/panel true

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/just-perfection/panel"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/just-perfection/panel-in-overview"
value = "true"

# ── logo menu: an enso where the distro logo was ────────────────────────────

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/Logo-menu/use-custom-icon"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/Logo-menu/custom-icon-path"
value = "'{{ home }}/.local/share/gtheme/assets/shoji/shoji-enso.svg'"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/Logo-menu/symbolic-icon"
value = "true"

# ── tiling shell: airy gaps, no window chrome ──────────────────────────────
# A painting is never framed in red: the old vermilion focus border read as
# an alert, not a seal. Kept explicitly false so re-apply heals systems
# that still carry it.

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/last-version-name-installed"
value = "'17.3'"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/enable-snap-assist"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/enable-window-border"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/window-use-custom-border-color"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/inner-gaps"
value = "uint32 10"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/outer-gaps"
value = "uint32 6"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/show-indicator"
value = "false"

# NOTE: rounded-window-corners@fxgn (Reborn) is deliberately NOT used by this
# theme. It is in a hard ERROR state on GNOME 50 (see the jojo theme's manifest
# for the failure mode); GNOME's native libadwaita rounding covers window
# top-corners instead.
