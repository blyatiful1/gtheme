[general]
import = ["~/.config/alacritty/shoji.toml"]

[env]
TERM = "xterm-256color"

[window]
# frosted washi: blur-my-shell whitelists Alacritty, this supplies the glass
opacity = 0.92
dynamic_padding = true
padding = { x = 18, y = 16 }

[font]
size = 12.0

[font.normal]
family = "MesloLGS Nerd Font"
style  = "Regular"

[font.bold]
family = "MesloLGS Nerd Font"
style  = "Bold"

[font.italic]
family = "MesloLGS Nerd Font"
style  = "Italic"

[cursor]
unfocused_hollow = true
style = { shape = "Beam", blinking = "On" }

[scrolling]
history = 10000

# Shift+Enter sends ESC + CR (escaped newline)
[[keyboard.bindings]]
key   = "Return"
mods  = "Shift"
chars = "\u001B\r"
