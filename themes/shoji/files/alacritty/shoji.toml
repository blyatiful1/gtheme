# SHOJI — Paper & Ink — hand-authored light scheme.
# (Not engine-rendered: the shared template derives brights by lightening,
# which points the wrong way on paper. Edit palette.toml AND this file.)

[colors.primary]
background      = "#F2EFE5"
foreground      = "#33302A"
dim_foreground  = "#6E6857"
bright_foreground = "#1C1A15"

[colors.cursor]
text   = "#F2EFE5"
cursor = "#B3402E"

[colors.selection]
text       = "#33302A"
background = "#E7DBB7"

[colors.normal]
black   = "#4A453A"
red     = "#B3402E"
green   = "#5F7A38"
yellow  = "#977119"
blue    = "#3B5F82"
magenta = "#7E5083"
cyan    = "#37766D"
white   = "#D9D3C2"

[colors.bright]
black   = "#7A7361"
red     = "#D0543B"
green   = "#74924A"
yellow  = "#B58A20"
blue    = "#4E76A0"
magenta = "#98689E"
cyan    = "#4A9187"
white   = "#FBF9F2"
