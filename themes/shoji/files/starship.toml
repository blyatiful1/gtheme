# ──────────────────────────────────────────────────────────────────────
#  SHOJI — starship prompt
#  Washi paper, sumi ink, one vermilion hanko. No powerline armour,
#  no wedges — the prompt is brushwork on paper and the single red
#  character is the seal.
#
#    ~/code/gtheme on  main [!] · py 3.13  took 3s
#    ❯
#
#  Font: MesloLGS Nerd Font (all glyphs verified against its cmap).
# ──────────────────────────────────────────────────────────────────────

"$schema" = 'https://starship.rs/config-schema.json'

# Keep it fast: short module timeout, no network-dependent modules.
command_timeout = 500
scan_timeout = 30
add_newline = true

palette = 'shoji'

format = """
$username\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$c\
$docker_context\
$cmd_duration\
$battery\
$line_break\
$character"""

[palettes.shoji]
# paper & ink
washi       = '#F2EFE5'   # background (the terminal supplies it)
sumi        = '#33302A'   # ink
sumi_bold   = '#1C1A15'
faded       = '#6E6857'   # diluted ink
whisper     = '#9A9382'   # barely-there strokes
vermilion   = '#B3402E'   # the hanko
vermilion_b = '#D0543B'
ochre       = '#977119'   # yamabuki — warnings
matcha      = '#5F7A38'
indigo      = '#3B5F82'   # ai — information
plum        = '#7E5083'

# Appears only for root / SSH / user switch — then it matters.
[username]
show_always = false
style_user = 'bold fg:indigo'
style_root = 'bold fg:vermilion'
format = '[$user]($style)[@](fg:whisper)'

# The subject line: where you are, in bold ink.
[directory]
style = 'bold fg:sumi_bold'
read_only_style = 'fg:vermilion'
read_only = ' 󰌾'
format = '[$path]($style)[$read_only]($read_only_style) '
truncation_length = 3
truncation_symbol = '…/'

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ''
'Music' = '󰝚'
'Pictures' = ''
'Developer' = '󰲋'

# A margin note: branch in diluted ink.
[git_branch]
symbol = ''
style = 'fg:faded'
format = '[on](fg:whisper) [$symbol $branch]($style) '

# Only unfinished business earns the ochre mark.
[git_status]
style = 'fg:ochre'
format = '([\[$all_status$ahead_behind\]]($style) )'

# Toolchains: whisper-quiet, version only when it exists.
[python]
symbol = ''
style = 'fg:whisper'
format = '[· $symbol( $version)]($style) '

[nodejs]
symbol = ''
style = 'fg:whisper'
format = '[· $symbol( $version)]($style) '

[rust]
symbol = ''
style = 'fg:whisper'
format = '[· $symbol( $version)]($style) '

[golang]
symbol = ''
style = 'fg:whisper'
format = '[· $symbol( $version)]($style) '

[c]
symbol = ''
style = 'fg:whisper'
format = '[· $symbol( $version)]($style) '

# Quiet unless a docker context is actually configured.
[docker_context]
symbol = ''
style = 'fg:whisper'
only_with_files = true
format = '[· $symbol( $context)]($style) '

# Time taken, only when it was actually slow.
[cmd_duration]
min_time = 2000
style = 'fg:faded'
format = '[took $duration]($style) '

# Hidden above 25%; ochre 16-25%, vermilion at 15% and below.
[battery]
full_symbol = ' '
charging_symbol = ' '
discharging_symbol = ' '
unknown_symbol = ' '
empty_symbol = ' '
format = '[$symbol$percentage]($style) '

[[battery.display]]
threshold = 15
style = 'bold fg:vermilion'

[[battery.display]]
threshold = 25
style = 'fg:ochre'

# The hanko: one vermilion stroke, pressed at the end.
[character]
disabled = false
success_symbol = '[❯](bold fg:vermilion)'
error_symbol = '[❯](bold fg:ochre)'
vimcmd_symbol = '[❮](bold fg:indigo)'
vimcmd_replace_one_symbol = '[❮](bold fg:ochre)'
vimcmd_replace_symbol = '[❮](bold fg:ochre)'
vimcmd_visual_symbol = '[❮](bold fg:plum)'

[line_break]
disabled = false

# Explicitly parked (cloud/cluster noise, keeps the prompt fast).
[time]
disabled = true

[kubernetes]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true

[azure]
disabled = true
