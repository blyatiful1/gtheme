# MAGMA — Obsidian Flow desktop theme.
# Palette in palette.toml; terminal/monitor/editor/gtk render from it.

[meta]
name = "magma"
title = "MAGMA — Obsidian Flow"
description = "Obsidian glass over a living magma chamber: ember orange, lava gold, one cool teal vein. Ships a real lava-lamp fluid sim for the terminal."
author = "blyatiful1"
version = "1.0.0"

[requires]
packages = ["alacritty", "starship", "btop", "micro", "fastfetch", "papirus-icon-theme", "papirus-folders", "ptyxis"]
extensions = ["dash-to-dock@micxgx.gmail.com", "blur-my-shell@aunetx", "just-perfection-desktop@just-perfection", "logomenu@aryan_k", "tilingshell@ferrarodomenico.com"]
fonts = ["MesloLGS Nerd Font"]

[build]
managed = ["terminal", "monitor", "editor", "gtk"]

[[files]]
component = "wallpaper"
src = "files/wallpaper/obsidian-flow.png"
dest = "~/.local/share/backgrounds/magma/obsidian-flow.png"

[[files]]
component = "wallpaper"
src = "files/wallpaper/molten-core.png"
dest = "~/.local/share/backgrounds/magma/molten-core.png"

[[files]]
component = "wallpaper"
src = "files/wallpaper/ember-drift.png"
dest = "~/.local/share/backgrounds/magma/ember-drift.png"

[[files]]
component = "wallpaper"
src = "files/wallpaper/magma-slideshow.xml"
dest = "~/.local/share/backgrounds/magma/magma-slideshow.xml"
# Rendered through {{ home }} substitution at apply time so the slideshow
# resolves to the running user's backgrounds dir, not the author's.
template = true

[[files]]
component = "terminal"
src = "files/ptyxis/Magma.palette"
dest = "~/.local/share/org.gnome.Ptyxis/palettes/Magma.palette"

[[files]]
component = "terminal"
src = "files/alacritty/magma.toml"
dest = "~/.config/alacritty/magma.toml"

[[files]]
component = "terminal"
src = "files/alacritty/alacritty.toml"
dest = "~/.config/alacritty/alacritty.toml"

[[files]]
component = "prompt"
src = "files/starship.toml"
dest = "~/.config/starship.toml"

[[files]]
component = "monitor"
src = "files/btop/magma.theme"
dest = "~/.config/btop/themes/magma.theme"

[[files]]
component = "monitor"
src = "files/btop/btop.conf"
dest = "~/.config/btop/btop.conf"

[[files]]
component = "editor"
src = "files/micro/magma.micro"
dest = "~/.config/micro/colorschemes/magma.micro"

[[files]]
component = "editor"
src = "files/micro/settings.json"
dest = "~/.config/micro/settings.json"

[[files]]
component = "fastfetch"
src = "files/fastfetch/magma-logo.txt"
dest = "~/.config/fastfetch/magma-logo.txt"

[[files]]
component = "fastfetch"
src = "files/fastfetch/config.jsonc"
dest = "~/.config/fastfetch/config.jsonc"

[[files]]
component = "gtk"
src = "files/gtk/gtk.css"
dest = "~/.config/gtk-4.0/gtk.css"

[[files]]
component = "gtk"
src = "files/gtk/gtk.css"
dest = "~/.config/gtk-3.0/gtk.css"

[[files]]
component = "shell"
src = "files/shell/magma-flame.svg"
dest = "~/.local/share/gtheme/assets/magma/magma-flame.svg"

[[files]]
component = "shell-cfg"
src = "files/fish/config.fish"
dest = "~/.config/fish/config.fish"

# NOTE: runtime payload lives under assets/, NOT ~/.local/share/gtheme/themes/
# — that namespace is owned by `gtheme install` and is rmtree'd on update/remove.
[[files]]
component = "commands"
src = "files/bin"
dest = "~/.local/share/gtheme/assets/magma/bin"
mode = "755"

[[files]]
component = "ascii"
src = "files/ascii"
dest = "~/.local/share/gtheme/assets/magma/ascii"

[[settings]]
component = "desktop"
backend = "gsettings"
key = "org.gnome.desktop.interface accent-color"
value = "'orange'"

[[settings]]
component = "desktop"
backend = "gsettings"
# NOTE: this is a dark design; vanilla GNOME defaults to the light scheme, so
# without prefer-dark the theme looks half-applied on a stock install.
key = "org.gnome.desktop.interface color-scheme"
value = "'prefer-dark'"

[[settings]]
component = "desktop"
backend = "gsettings"
key = "org.gnome.desktop.interface icon-theme"
# Papirus-Dark with folders recoloured orange (papirus-folders -C orange -t Papirus-Dark).
# Package install + recolour are a one-time sudo step; see [requires].packages.
value = "'Papirus-Dark'"

[[settings]]
component = "terminal"
backend = "dconf"
key = "/org/gnome/Ptyxis/Profiles/{{ ptyxis_default_profile }}/palette"
value = "'Magma'"

[[settings]]
component = "terminal"
backend = "gsettings"
key = "org.gnome.Ptyxis use-system-font"
value = "false"

[[settings]]
component = "terminal"
backend = "gsettings"
key = "org.gnome.Ptyxis font-name"
value = "'MesloLGS Nerd Font Mono 11'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background picture-uri"
value = "'file://{{ home }}/.local/share/backgrounds/magma/magma-slideshow.xml'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background picture-uri-dark"
value = "'file://{{ home }}/.local/share/backgrounds/magma/magma-slideshow.xml'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background picture-options"
value = "'zoom'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background primary-color"
value = "'#0D0A0F'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/dock-position"
value = "'BOTTOM'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/transparency-mode"
value = "'FIXED'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-background-color"
value = "true"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/background-color"
value = "'#181019'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/background-opacity"
value = "0.72"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/running-indicator-style"
value = "'DOTS'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-customize-running-dots"
value = "true"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-color"
value = "'#FF6D3A'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-border-color"
value = "'#FFC145'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-border-width"
value = "1"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/dash-to-dock/override-background"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/Logo-menu/use-custom-icon"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/Logo-menu/custom-icon-path"
value = "'{{ home }}/.local/share/gtheme/assets/magma/magma-flame.svg'"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/Logo-menu/symbolic-icon"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/just-perfection/startup-status"
value = "0"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/enable-window-border"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/window-border-width"
value = "uint32 2"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/window-border-color"
value = "'#FF6D3A'"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/blur"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/enable-all"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/whitelist"
value = "['Alacritty']"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/sigma"
value = "24"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/static-blur"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/dynamic-opacity"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/corner-radius"
value = "12"

# NOTE: rounded-window-corners@fxgn (Reborn) is deliberately NOT used — it is
# broken on GNOME 50 (shader crash strands shadow actors on the Shell stage).
# Native libadwaita rounding covers window top-corners.
