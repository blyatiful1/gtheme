# Converted from the v1 gtheme theme format by tools in src/gtheme/preset/v1_import.py.
# See README.md in this folder for everything the conversion left behind.

format = 2

[meta]
name = "magma"
title = "MAGMA — Obsidian Flow"
description = "Obsidian glass over a living magma chamber: ember orange, lava gold, one cool teal vein. Molten-glass blur, ember running dots and a slideshow of the chamber itself."
author = "blyatiful1"
version = "2.0.0"
screenshots = ["files/wallpaper/obsidian-flow.png"]

[palette]
bg = "#0D0A0F"
surface1 = "#181019"
surface2 = "#261826"
fg = "#F2E5D5"
fg_bright = "#FFF6E8"
fg_dim = "#C7B4A4"
accent = "#FF6D3A"
accent_bright = "#FFA05C"
warn = "#FFB454"
error = "#F25050"
info = "#45C7B5"
selection = "#3A2030"
comment = "#7A6470"
cursor = "#FF6D3A"
gold = "#FFC145"
crimson = "#E0304E"
violet = "#B07BE8"
teal = "#45C7B5"
ansi_black = "#241823"
red = "#F25050"
green = "#A8C64E"
yellow = "#FFB454"
blue = "#5FA3E6"
magenta = "#B07BE8"
cyan = "#45C7B5"
ansi_white = "#D8C8B8"
bright_black = "#6B5462"
bright_red = "#FF7A6E"
bright_green = "#C2E06E"
bright_yellow = "#FFD168"
bright_blue = "#84C0FF"
bright_magenta = "#D49CFF"
bright_cyan = "#6EE8D5"
bright_white = "#FFF6E8"

[[files]]
src = "files/wallpaper/obsidian-flow.png"
dest = "~/.local/share/backgrounds/magma/obsidian-flow.png"

[[files]]
src = "files/wallpaper/molten-core.png"
dest = "~/.local/share/backgrounds/magma/molten-core.png"

[[files]]
src = "files/wallpaper/ember-drift.png"
dest = "~/.local/share/backgrounds/magma/ember-drift.png"

[[files]]
