dest = "~/.local/share/backgrounds/magma/magma-slideshow.xml"
template = true

[[files]]
src = "files/wallpaper/magma-loop.mp4"
dest = "~/.local/share/backgrounds/magma/magma-loop.mp4"

[[files]]
src = "files/ptyxis/Magma.palette"
dest = "~/.local/share/org.gnome.Ptyxis/palettes/Magma.palette"

[[files]]
src = "files/alacritty/magma.toml"
dest = "~/.config/alacritty/magma.toml"

[[files]]
src = "files/alacritty/alacritty.toml"
dest = "~/.config/alacritty/alacritty.toml"

[[files]]
src = "files/starship/starship.toml"
dest = "~/.config/starship.toml"

[[files]]
src = "files/shell-theme/gnome-shell.css"
dest = "~/.local/share/themes/Magma/gnome-shell/gnome-shell.css"

[[files]]
src = "files/btop/magma.theme"
dest = "~/.config/btop/themes/magma.theme"

[[files]]
src = "files/btop/btop.conf"
dest = "~/.config/btop/btop.conf"

[[files]]
src = "files/micro/magma.micro"
dest = "~/.config/micro/colorschemes/magma.micro"

[[files]]
src = "files/micro/settings.json"
dest = "~/.config/micro/settings.json"

[[files]]
src = "files/fastfetch/magma-logo.txt"
dest = "~/.config/fastfetch/magma-logo.txt"

[[files]]
src = "files/fastfetch/config.jsonc"
dest = "~/.config/fastfetch/config.jsonc"

[[files]]
src = "files/gtk/gtk4.css"
dest = "~/.config/gtk-4.0/gtk.css"

[[files]]
src = "files/gtk/gtk3.css"
dest = "~/.config/gtk-3.0/gtk.css"

[[files]]
src = "files/cava/config"
dest = "~/.config/cava/config"

[[files]]
src = "files/shell/magma-flame.svg"
dest = "~/.local/share/gtheme/assets/magma/magma-flame.svg"

[[settings]]
key = "gsettings:org.gnome.desktop.interface accent-color"
value = "'orange'"
component = "colors"

[[settings]]
key = "gsettings:org.gnome.desktop.interface color-scheme"
value = "'prefer-dark'"
component = "colors"

[[settings]]
key = "gsettings:org.gnome.desktop.interface icon-theme"
value = "'Papirus-Dark'"
component = "icons"

[[settings]]
key = "dconf:/org/gnome/Ptyxis/Profiles/{{ ptyxis_default_profile }}/palette"
value = "'Magma'"
component = "terminal"

[[settings]]
key = "gsettings:org.gnome.Ptyxis use-system-font"
value = "false"
component = "fonts"

[[settings]]
key = "gsettings:org.gnome.Ptyxis font-name"
value = "'MesloLGS Nerd Font Mono 11'"
component = "fonts"

[[settings]]
key = "dconf:/org/gnome/Ptyxis/Profiles/{{ ptyxis_default_profile }}/opacity"
value = "0.85"
