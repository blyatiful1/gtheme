[general]
import = ["~/.config/alacritty/magma.toml"]

[env]
TERM = "xterm-256color"

[window]
opacity = 0.82
blur = true
dynamic_padding = true
padding = { x = 16, y = 14 }
decorations_theme_variant = "Dark"

[font]
size = 12.0

[font.normal]
family = "MesloLGS Nerd Font"
style  = "Regular"

[font.bold]
family = "MesloLGS Nerd Font"
style  = "Bold"

[font.italic]
family = "MesloLGS Nerd Font"
style  = "Italic"

[cursor]
unfocused_hollow = true
style = { shape = "Beam", blinking = "On" }

[scrolling]
history = 10000

# Shift+Enter sends ESC + CR (escaped newline)
[[keyboard.bindings]]
key   = "Return"
mods  = "Shift"
chars = "\u001B\r"
