# NIGHTBLOOM, authored for gtheme v2 from the live rice at ~/nightbloom.
# The rice itself is a hand-run repo with a README as its manual; this Look is the
# part of it that reduces to files and settings. README.md in this folder names
# every piece that did not come across, and why.

format = 2

[meta]
name = "nightbloom"
title = "NIGHTBLOOM — the glasshouse after dark"
description = "A Victorian glass conservatory at night: real glass panes over deep green dark, bioluminescent jade, and exactly one amber firefly on every surface. Rare violet grow-lights. Nothing pure black, no window borders."
author = "blyatiful1"
version = "1.0.0"
min_shell = "49"
screenshots = ["wallpaper/nightbloom-glasshouse.png"]

[palette]
void = "#0A100C"
surface = "#0F1712"
moss = "#16211A"
glassline = "#2A3D31"
verdigris = "#3E7A63"
jade = "#52E0A4"
jade_dim = "#3DA97E"
teal = "#7BD8C4"
amber = "#F5C04A"
growlight = "#C77DFF"
bone = "#E8E4D6"
sage = "#8CA294"
error = "#E05A47"
brass = "#BD9738"
ansi_black = "#16211A"
ansi_red = "#E05A47"
ansi_green = "#52E0A4"
ansi_yellow = "#F5C04A"
ansi_blue = "#6E9ECF"
ansi_magenta = "#C77DFF"
ansi_cyan = "#7BD8C4"
ansi_white = "#E8E4D6"
ansi_bright_black = "#5C6E62"
ansi_bright_red = "#F07B66"
ansi_bright_green = "#7FF0C0"
ansi_bright_yellow = "#FFD97A"
ansi_bright_blue = "#8FB8E0"
ansi_bright_magenta = "#DBA6FF"
ansi_bright_cyan = "#A3EBDC"
ansi_bright_white = "#F4F1E8"
term_background = "#0A100C"
term_foreground = "#E8E4D6"
term_cursor = "#F5C04A"
term_cursor_text = "#0A100C"
term_selection_background = "#2A3D31"
term_selection_foreground = "#E8E4D6"

[[files]]
src = "ghostty/config"
dest = "~/.config/ghostty/config"

[[files]]
src = "ghostty/nightbloom.css"
dest = "~/.config/ghostty/nightbloom.css"

[[files]]
src = "ghostty/themes/nightbloom"
dest = "~/.config/ghostty/themes/nightbloom"

[[files]]
src = "ghostty/shaders/nightbloom_firefly.glsl"
dest = "~/.config/ghostty/shaders/nightbloom_firefly.glsl"

[[files]]
src = "ghostty/shaders/nightbloom_fog.glsl"
dest = "~/.config/ghostty/shaders/nightbloom_fog.glsl"

[[files]]
src = "wallpaper/nightbloom-glasshouse.png"
dest = "~/.local/share/backgrounds/nightbloom/nightbloom-glasshouse.png"

[[files]]
src = "shell-theme/gnome-shell.css"
dest = "~/.local/share/themes/Nightbloom/gnome-shell/gnome-shell.css"

[[files]]
src = "ptyxis/Nightbloom.palette"
dest = "~/.local/share/org.gnome.Ptyxis/palettes/Nightbloom.palette"

[[files]]
src = "emblem/nightbloom-emblem.svg"
dest = "~/.local/share/gtheme/assets/nightbloom/nightbloom-emblem.svg"

[[settings]]
key = "gsettings:org.gnome.desktop.interface color-scheme"
