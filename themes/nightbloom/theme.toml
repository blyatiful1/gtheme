value = "'zoom'"
component = "wallpaper"

[[settings]]
key = "gsettings:org.gnome.desktop.background primary-color"
value = "'#0A100C'"
component = "wallpaper"

[[settings]]
key = "gsettings:org.gnome.desktop.screensaver picture-uri"
value = "'file://{{ home }}/.local/share/backgrounds/nightbloom/nightbloom-glasshouse.png'"
component = "wallpaper"

[[settings]]
key = "gsettings:org.gnome.desktop.screensaver picture-options"
value = "'zoom'"
component = "wallpaper"

