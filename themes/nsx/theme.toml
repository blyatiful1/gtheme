# NSX — 1990 Honda NSX (NA1) "Formula" desktop theme.
# Generated by gtheme; palette in palette.toml.

[meta]
name = "nsx"
title = "NSX — Formula Red"
description = "Honda NSX NA1: Berlina-black cabin, Formula Red, Championship White."
author = "blyatiful1"
version = "1.0.0"

[requires]
packages = ["alacritty", "starship", "btop", "micro", "fastfetch"]
extensions = ["dash-to-dock@micxgx.gmail.com", "blur-my-shell@aunetx", "just-perfection-desktop@just-perfection", "logomenu@aryan_k", "tilingshell@ferrarodomenico.com"]
fonts = ["MesloLGS Nerd Font"]

[build]
# components the palette render engine owns; the rest are hand-authored
managed = ["terminal", "monitor", "editor", "gtk"]

[[files]]
component = "terminal"
src = "files/alacritty/alacritty.toml"
dest = "~/.config/alacritty/alacritty.toml"

[[files]]
component = "terminal"
src = "files/alacritty/nsx.toml"
dest = "~/.config/alacritty/nsx.toml"

[[files]]
component = "terminal"
src = "files/ptyxis/NSX.palette"
dest = "~/.local/share/org.gnome.Ptyxis/palettes/NSX.palette"

[[files]]
component = "prompt"
src = "files/starship.toml"
dest = "~/.config/starship.toml"

[[files]]
component = "shell-cfg"
src = "files/fish/config.fish"
dest = "~/.config/fish/config.fish"

[[files]]
component = "monitor"
src = "files/btop/btop.conf"
dest = "~/.config/btop/btop.conf"

[[files]]
component = "monitor"
src = "files/btop/nsx.theme"
dest = "~/.config/btop/themes/nsx.theme"

[[files]]
component = "editor"
src = "files/micro/nsx.micro"
dest = "~/.config/micro/colorschemes/nsx.micro"

[[files]]
component = "editor"
src = "files/micro/settings.json"
dest = "~/.config/micro/settings.json"

[[files]]
component = "fastfetch"
src = "files/fastfetch/config.jsonc"
dest = "~/.config/fastfetch/config.jsonc"

[[files]]
component = "fastfetch"
src = "files/fastfetch/nsx-logo.txt"
dest = "~/.config/fastfetch/nsx-logo.txt"

[[files]]
component = "gtk"
src = "files/gtk/gtk3.css"
dest = "~/.config/gtk-3.0/gtk.css"

[[files]]
component = "gtk"
src = "files/gtk/gtk4.css"
dest = "~/.config/gtk-4.0/gtk.css"

[[files]]
component = "shell"
src = "files/shell/nsx-symbol.svg"
dest = "~/.local/share/gtheme/assets/nsx/nsx-symbol.svg"

[[files]]
component = "wallpaper"
src = "files/wallpaper/gauge.png"
dest = "~/.local/share/backgrounds/nsx/gauge.png"

[[files]]
component = "wallpaper"
src = "files/wallpaper/silhouette.png"
dest = "~/.local/share/backgrounds/nsx/silhouette.png"

[[files]]
component = "wallpaper"
src = "files/wallpaper/taillight.png"
dest = "~/.local/share/backgrounds/nsx/taillight.png"

[[files]]
component = "wallpaper"
src = "files/wallpaper/wordmark.png"
dest = "~/.local/share/backgrounds/nsx/wordmark.png"

[[settings]]
component = "desktop"
backend = "gsettings"
key = "org.gnome.desktop.interface accent-color"
value = "'red'"

[[settings]]
component = "desktop"
backend = "gsettings"
# NOTE: this is a dark design; vanilla GNOME defaults to the light scheme, so
# without prefer-dark the theme looks half-applied on a stock install.
key = "org.gnome.desktop.interface color-scheme"
value = "'prefer-dark'"

[[settings]]
component = "terminal"
backend = "dconf"
key = "/org/gnome/Ptyxis/Profiles/{{ ptyxis_default_profile }}/palette"
value = "'NSX'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background picture-uri"
value = "'file://{{ home }}/.local/share/backgrounds/nsx/gauge.png'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background picture-uri-dark"
value = "'file://{{ home }}/.local/share/backgrounds/nsx/gauge.png'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background picture-options"
value = "'zoom'"

[[settings]]
component = "wallpaper"
backend = "gsettings"
key = "org.gnome.desktop.background primary-color"
value = "'#0D0D0F'"

[[settings]]
component = "shell"
backend = "gsettings"
key = "org.gnome.shell enabled-extensions"
value = "['dash-to-dock@micxgx.gmail.com', 'blur-my-shell@aunetx', 'just-perfection-desktop@just-perfection', 'logomenu@aryan_k', 'tilingshell@ferrarodomenico.com']"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/dock-position"
value = "'BOTTOM'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/intellihide"
value = "true"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/dock-fixed"
value = "false"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/transparency-mode"
value = "'FIXED'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-background-color"
value = "true"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/background-color"
value = "'#0D0D0F'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/background-opacity"
value = "0.65"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/apply-custom-theme"
value = "false"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-customize-running-dots"
value = "true"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-color"
value = "'#D2241E'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-border-color"
value = "'#D2241E'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/custom-theme-running-dots-border-width"
value = "1"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/extend-height"
value = "false"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/dash-max-icon-size"
value = "44"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/click-action"
value = "'minimize-or-overview'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/dash-to-dock/show-trash"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/settings-version"
value = "2"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/panel/blur"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/panel/static-blur"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/panel/pipeline"
value = "'pipeline_default'"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/panel/sigma"
value = "30"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/panel/brightness"
value = "0.6"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/overview/blur"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/overview/pipeline"
value = "'pipeline_default'"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/dash-to-dock/blur"
value = "true"

[[settings]]
component = "dock"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/dash-to-dock/static-blur"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/applications/blur"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/blur-my-shell/lockscreen/blur"
value = "true"

# NOTE: rounded-window-corners@fxgn (Reborn) is deliberately NOT used by this
# theme. It is in a hard ERROR state on GNOME 50 (see the jojo theme's manifest
# for the failure mode); GNOME's native libadwaita rounding covers window
# top-corners instead.

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/just-perfection/animation"
value = "4"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/just-perfection/activities-button"
value = "false"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/Logo-menu/use-custom-icon"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/Logo-menu/custom-icon-path"
value = "'{{ home }}/.local/share/gtheme/assets/nsx/nsx-symbol.svg'"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/Logo-menu/symbolic-icon"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/last-version-name-installed"
value = "'17.3'"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/enable-snap-assist"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/enable-window-border"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/window-use-custom-border-color"
value = "true"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/window-border-color"
value = "'#D2241E'"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/window-border-width"
value = "uint32 2"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/inner-gaps"
value = "uint32 8"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/outer-gaps"
value = "uint32 4"

[[settings]]
component = "shell"
backend = "dconf"
key = "/org/gnome/shell/extensions/tilingshell/show-indicator"
value = "false"
