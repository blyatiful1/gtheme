<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- barely perceptible background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0D0F"/>
      <stop offset="1" stop-color="#101013"/>
    </linearGradient>
    <!-- red glow bleed behind the bar -->
    <radialGradient id="bleed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D2241E" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#D2241E" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#D2241E" stop-opacity="0"/>
    </radialGradient>
    <!-- lens base -->
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A1A15"/>
      <stop offset="0.55" stop-color="#641411"/>
      <stop offset="1" stop-color="#4E100D"/>
    </linearGradient>
    <!-- round lamp lens -->
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A70"/>
      <stop offset="0.3" stop-color="#F25043"/>
      <stop offset="0.68" stop-color="#D2241E"/>
      <stop offset="1" stop-color="#9A1612"/>
    </radialGradient>
    <!-- luminance pass above the smoked lens -->
    <radialGradient id="lampGlowTop" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A70" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#F04A3E" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#F04A3E" stop-opacity="0"/>
    </radialGradient>
    <!-- soft halo around each lamp, gradient only (no blur banding) -->
    <radialGradient id="lampHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F04A3E" stop-opacity="0.40"/>
      <stop offset="0.55" stop-color="#F04A3E" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F04A3E" stop-opacity="0"/>
    </radialGradient>
    <!-- smoked overlay -->
    <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#000000" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>
    <!-- soft reflection on body below -->
    <radialGradient id="refl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D2241E" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#D2241E" stop-opacity="0"/>
    </radialGradient>
    <!-- panel gap line fading at both ends -->
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26272B" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#26272B" stop-opacity="1"/>
      <stop offset="0.8" stop-color="#26272B" stop-opacity="1"/>
      <stop offset="1" stop-color="#26272B" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur20" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- glow bleed onto black bodywork -->
  <ellipse cx="960" cy="670" rx="760" ry="190" fill="url(#bleed)"/>
  <!-- reflection on lower bodywork -->
  <ellipse cx="960" cy="800" rx="520" ry="80" fill="url(#refl)"/>

  <!-- ============ taillight bar ============ -->
  <!-- halo hugging the bar -->
  <rect x="390" y="620" width="1140" height="100" rx="34" fill="#D2241E" opacity="0.26" filter="url(#blur20)"/>

  <!-- lens body -->
  <rect x="390" y="620" width="1140" height="100" rx="34" fill="url(#lens)"/>

  <clipPath id="barClip">
    <rect x="390" y="620" width="1140" height="100" rx="34"/>
  </clipPath>
  <g clip-path="url(#barClip)">
    <!-- four round lamps -->
    <g>
      <!-- halos -->
      <circle cx="462" cy="670" r="56" fill="url(#lampHalo)"/>
      <circle cx="576" cy="670" r="56" fill="url(#lampHalo)"/>
      <circle cx="1344" cy="670" r="56" fill="url(#lampHalo)"/>
      <circle cx="1458" cy="670" r="56" fill="url(#lampHalo)"/>
      <!-- housing recess -->
      <circle cx="462" cy="670" r="38" fill="#3A0C0A"/>
      <circle cx="576" cy="670" r="38" fill="#3A0C0A"/>
      <circle cx="1344" cy="670" r="38" fill="#3A0C0A"/>
      <circle cx="1458" cy="670" r="38" fill="#3A0C0A"/>
      <!-- lamp lenses -->
      <circle cx="462" cy="670" r="33" fill="url(#lamp)"/>
      <circle cx="576" cy="670" r="33" fill="url(#lamp)"/>
      <circle cx="1344" cy="670" r="33" fill="url(#lamp)"/>
      <circle cx="1458" cy="670" r="33" fill="url(#lamp)"/>
      <!-- housing ring outline -->
      <circle cx="462" cy="670" r="38" fill="none" stroke="#1A0605" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="576" cy="670" r="38" fill="none" stroke="#1A0605" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="1344" cy="670" r="38" fill="none" stroke="#1A0605" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="1458" cy="670" r="38" fill="none" stroke="#1A0605" stroke-opacity="0.5" stroke-width="2"/>
      <!-- inner bezel rings -->
      <circle cx="462" cy="670" r="26" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1.5"/>
      <circle cx="576" cy="670" r="26" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1.5"/>
      <circle cx="1344" cy="670" r="26" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1.5"/>
      <circle cx="1458" cy="670" r="26" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="1.5"/>
    </g>

    <!-- subtle lens ribbing -->
    <g fill="#000000" opacity="0.10">
      <rect x="390" y="644" width="1140" height="1.5"/>
      <rect x="390" y="668" width="1140" height="1.5"/>
      <rect x="390" y="692" width="1140" height="1.5"/>
    </g>

    <!-- subtle segment seams -->
    <rect x="645" y="626" width="2" height="88" fill="#1A0605" opacity="0.5"/>
    <rect x="1273" y="626" width="2" height="88" fill="#1A0605" opacity="0.5"/>

    <!-- smoked lens overlay -->
    <rect x="390" y="620" width="1140" height="100" fill="url(#smoke)"/>

    <!-- lamps glowing through the smoke -->
    <circle cx="462" cy="670" r="44" fill="url(#lampGlowTop)"/>
    <circle cx="576" cy="670" r="44" fill="url(#lampGlowTop)"/>
    <circle cx="1344" cy="670" r="44" fill="url(#lampGlowTop)"/>
    <circle cx="1458" cy="670" r="44" fill="url(#lampGlowTop)"/>

    <!-- top inner highlight of lens -->
    <rect x="404" y="625" width="1112" height="2" fill="#F2F3EA" opacity="0.10"/>
  </g>

  <!-- titanium hairline trim -->
  <rect x="390" y="620" width="1140" height="100" rx="34" fill="none" stroke="#AEB2B5" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- subtle panel gap line below the light -->
  <rect x="510" y="764" width="900" height="1.5" fill="url(#panel)"/>

  <!-- ============ NSX wordmark (vector, italic) ============ -->
  <!-- letters drawn in 176x60 box, skewed for italic -->
  <g fill="#E8E9DF" transform="translate(960,778) scale(0.85) skewX(-12) translate(-81.6,0)">
    <!-- N -->
    <polygon points="0,0 11,0 11,60 0,60"/>
    <polygon points="0,0 14,0 48,60 34,60"/>
    <polygon points="37,0 48,0 48,60 37,60"/>
    <!-- S (curved outer corners) -->
    <path d="M108,0 L108,11 L82,11 Q77,11 77,16 L77,19.5 Q77,24.5 82,24.5 L108,24.5 L108,48 Q108,60 96,60 L66,60 L66,49 L92,49 Q97,49 97,44 L97,40.5 Q97,35.5 92,35.5 L78,35.5 Q66,35.5 66,23.5 L66,12 Q66,0 78,0 Z"/>
    <!-- X -->
    <polygon points="126,0 140,0 176,60 162,60"/>
    <polygon points="162,0 176,0 140,60 126,60"/>
  </g>

  <!-- tagline -->
  <text x="963" y="868" text-anchor="middle" font-family="Cantarell, Adwaita Sans, Noto Sans" font-size="16" letter-spacing="6" fill="#C9CBC0" opacity="0.8">PRECISION CRAFTED PERFORMANCE</text>
</svg>
