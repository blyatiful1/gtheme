# Registry of palette-driven templates. `gtheme build` renders each one whose
# `component` is listed in the theme's [build].managed.  {name} = theme name,
# {Name} = capitalised name.

[[template]]
src = "alacritty.toml.j2"
out = "files/alacritty/{name}.toml"
component = "terminal"

[[template]]
src = "ptyxis.palette.j2"
out = "files/ptyxis/{Name}.palette"
component = "terminal"

[[template]]
src = "btop.theme.j2"
out = "files/btop/{name}.theme"
component = "monitor"

[[template]]
src = "micro.micro.j2"
out = "files/micro/{name}.micro"
component = "editor"

[[template]]
src = "gtk.css.j2"
out = "files/gtk/gtk.css"
component = "gtk"
